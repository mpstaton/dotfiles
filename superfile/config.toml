# General settings
theme = "~/.config/superfile/theme/catppuccin.toml"
editor = "nvim"
dir_editor = "nvim"
auto_check_update = true
cd_on_quit = true
default_open_file_preview = true
show_image_preview = true
default_directory = "~"

# Display settings
file_size_use_si = true
default_sort_type = "Name"
sort_order_reversed = false
case_sensitive_sort = false
debug = false
nerdfont = true
transparent_background = false

# Layout settings
file_preview_width = 50
code_previewer = "bat"
sidebar_width = 25

# Border characters
border_top = "─"
border_bottom = "─"
border_left = "│"
border_right = "│"
border_top_left = "╭"
border_top_right = "╮"
border_bottom_left = "╰"
border_bottom_right = "╯"
border_middle_left = "├"
border_middle_right = "┤"

# File metadata
[metadata]
enable = true

# Additional settings
enable_md5_checksum = false

