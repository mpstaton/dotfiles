format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$nodejs\
$cmd_duration $jobs $memory_usage $battery $time\
$line_break\
$character"""

# starship hides both of these by default -- username only renders as root or
# over SSH, and hostname is ssh_only. Forced on so the prompt identifies the
# machine the way the oh-my-posh theme did, which matters across m2air, the
# M4 Pro and the NixOS box.
[username]
show_always = true
style_user = "bold purple"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "purple"
format = "[@$hostname]($style) "

# Icon modules. starship ships these disabled or thresholded off by default,
# so the prompt had no glyphs beyond git -- which read as "the Nerd Font isn't
# working" next to the oh-my-posh theme, when the font was fine and the config
# simply never asked for them.
[os]
disabled = false
style = "bold white"
format = "[$symbol]($style)"

[os.symbols]
Macos = " "
Linux = " "
NixOS = " "

[memory_usage]
disabled = false
threshold = 0
symbol = " "
style = "purple"
format = "[$symbol${ram_pct}]($style)"

[battery]
full_symbol = " "
charging_symbol = " "
discharging_symbol = " "

[[battery.display]]
threshold = 100
style = "bold green"

[nodejs]
format = "[$symbol($version )]($style)"

[fill]
symbol = " "

[directory]
style = "blue"
read_only = " "
truncation_length = 4
truncate_to_repo = false

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](green)"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bright-black"

[jobs]
symbol = ""
style = "bold red"
number_threshold = 1
format = "[$symbol]($style)"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "cyan"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[git_metrics]
disabled = false

[cmd_duration]
format = "[ $duration]($style)"
style = "yellow"

[rust]
symbol = " "

[time]
disabled = false
style = "bold white"
format = "[ $time]($style)"

[custom.stunnel]
when = "ps aux | grep stunnel | grep -v grep"
command = "ps -o etime= -p $(ps aux | grep stunnel | grep -v grep | awk '{print $2}')"
style = "red"
format = "[TUNNEL OPEN for $output]($style)"